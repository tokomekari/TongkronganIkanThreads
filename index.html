 if(!document.querySelector('.progress-line')){let bar=document.createElement('div');bar.className='progress-line';document.body.appendChild(bar)}

window.addEventListener('scroll',()=>{let max=document.documentElement.scrollHeight-innerHeight;let bar=document.querySelector('.progress-line');if(bar)bar.style.width=(max>0?scrollY/max*100:0)+'%'},{passive:true});
document.addEventListener('click',e=>{let fact=e.target.closest('[data-fact-next]');if(fact){factIndex=(factIndex+1)%fishFacts.length;let p=fact.parentElement.querySelector('p');p.style.opacity=0;setTimeout(()=>{p.textContent=fishFacts[factIndex];p.style.opacity=1},150)}let like=e.target.closest('[data-action="like"],[data-action="like-fish"]');if(like){for(let i=0;i<4;i++){let s=document.createElement('span');s.className='fish-spark';s.textContent=['🐟','✦','♡','🐠'][i];s.style.left=(e.clientX+Math.random()*20-10)+'px';s.style.top=(e.clientY+Math.random()*12-8)+'px';s.style.setProperty('--drift',(Math.random()*70-35)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),950)}}if(e.target.closest('.btn,.icon-button,.action,.chip,.follow-mini')){let target=e.target.closest('.btn,.icon-button,.action,.chip,.follow-mini');let r=target.getBoundingClientRect(),d=document.createElement('i');d.className='ripple';let size=Math.max(r.width,r.height);d.style.width=d.style.height=size+'px';d.style.left=(e.clientX-r.left-size/2)+'px';d.style.top=(e.clientY-r.top-size/2)+'px';target.appendChild(d);setTimeout(()=>d.remove(),600)} });
document.addEventListener('keydown',e=>{if(e.key==='Escape'){let o=document.getElementById('overlay-root');if(o)o.innerHTML='';return}if(!state.authenticated)return;let typing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);if(e.key==='/'&&!typing){e.preventDefault();state.page='Search';render();document.getElementById('searchInput')?.focus();return}if(!typing&&e.key.toLowerCase()==='n'){e.preventDefault();showCompose();return}if(!typing&&e.key.toLowerCase()==='g'){keySequence='g';setTimeout(()=>keySequence='',1000);return}if(!typing&&keySequence==='g'){keySequence='';let k=e.key.toLowerCase();if(k==='h'){state.page='Home';render()}else if(k==='p'){state.page='Profile';render()}else if(k==='s'){state.page='Search';render()}}});

function authHTML(){if(state.screen==='register')return registerHTML();if(state.screen==='forgot')return forgotHTML();if(state.screen==='onboarding')return onboardingHTML();return `<div class="auth-wrap"><section class="auth-art"><div class="floating-fish">🐟</div><div class="auth-art-inner"><div class="fish-mark"><img src="https://i.ibb.co.com/93YJFbNF/icon-40x40-px.png" alt="Tongkrongan Ikan logo"></div><h1>Good fish.<br>Good people.</h1><p>Tempat ngobrol, berbagi, dan tumbuh bareng sesama pecinta ikan.</p><div style="margin-top:65px;font-size:12px;color:#888">A community by the water.</div></div></section><section class="auth-side"><div class="auth-top-tools"><button class="icon-button" data-action="theme" title="Toggle theme">${ico(state.theme==='dark'?'sun':'moon')}</button></div><div class="auth-box"><div class="auth-brand"><span class="fish-mark"><img src="https://i.ibb.co.com/93YJFbNF/icon-40x40-px.png" alt="Tongkrongan Ikan logo"></span> Tongkrongan Ikan</div><h2>Welcome back</h2><p class="intro">Continue your fish journey.</p><form id="loginForm"><div class="field"><label>Email or username</label><input class="input" id="loginId" placeholder="nama@email.com" autocomplete="username" required></div><div class="field"><label>Password</label><div class="pass-wrap"><input class="input" id="loginPass" type="password" placeholder="Enter your password" autocomplete="current-password" required><button type="button" class="eye" data-action="password">${ico('eye')}</button></div></div><div class="between"><label class="checkline"><input type="checkbox" checked> Remember me</label><button class="linkbtn" type="button" data-action="forgot">Forgot password?</button></div><button class="btn full" type="submit">Log in</button></form><div class="or">OR</div><button class="social-btn" data-action="demo-google">◎ &nbsp; Continue with Google</button><button class="social-btn" data-action="demo-apple"> &nbsp; Continue with Apple</button><p class="auth-foot">Don't have an account? <button class="linkbtn" data-action="register">Register</button></p><p class="auth-foot tiny" style="margin-top:25px">By continuing, you agree to our <u>Terms</u> and <u>Privacy Policy</u>.</p></div></section></div>`}
function registerHTML(){return `<div class="auth-wrap"><section class="auth-art"><div class="auth-art-inner"><div class="fish-mark"><img src="https://i.ibb.co.com/93YJFbNF/icon-40x40-px.png" alt="Tongkrongan Ikan logo"></div><h1>Your corner<br>of the ocean.</h1><p>Join hobbyists, breeders, and fish lovers who get it.</p></div></section><section class="auth-side"><div class="auth-top-tools"><button class="icon-button" data-action="theme">${ico(state.theme==='dark'?'sun':'moon')}</button></div><div class="auth-box"><div class="auth-brand"><span class="fish-mark"><img src="https://i.ibb.co.com/93YJFbNF/icon-40x40-px.png" alt="Tongkrongan Ikan logo"></span> Tongkrongan Ikan</div><h2>Create account</h2><p class="intro">A few details, then let's find your people.</p><form id="registerForm"><div class="field"><label>Profile photo <span class="muted">(optional)</span></label><input class="input" type="file" id="regPhoto" accept="image/*" style="padding:9px"></div><div class="field"><label>Display name</label><input class="input" name="display" required placeholder="Your name"></div><div class="field"><label>Username</label><input class="input" name="username" required placeholder="Choose a username"></div><div class="field"><label>Email</label><input class="input" type="email" name="email" required placeholder="name@example.com"></div><div class="form-row"><div class="field"><label>Password</label><input class="input" type="password" name="password" required minlength="6" placeholder="6+ characters"></div><div class="field"><label>Confirm password</label><input class="input" type="password" name="confirm" required placeholder="Repeat password"></div></div><div class="form-row"><div class="field"><label>Date of birth</label><input class="input" type="date" name="dob" required></div><div class="field"><label>Country / location</label><input class="input" name="location" placeholder="Bandung, Indonesia"></div></div><div class="field"><label>Account type</label><select class="s function onboardingHTML(){let steps=['Verify email','Create profile','Choose topics','Fish interests','Find your people'];let n=state.onboard;return `<div class="auth-wrap"><section class="auth-art"><div class="auth-art-inner"><div class="fish-mark"><img src="https://i.ibb.co.com/93YJFbNF/icon-40x40-px.png" alt="Tongkrongan Ikan logo"></div><h1>Welcome to<br>the shoal.</h1><p>Let's personalize your feed with the fish, topics, and people you love.</p></div></section><section class="auth-side"><div class="auth-box"><div class="auth-brand"><span class="fish-mark"><img src="https://i.ibb.co.com/93YJFbNF/icon-40x40-px.png" alt="Tongkrongan Ikan logo"></span> Tongkrongan Ikan</div><div class="stepdots">${steps.map((s,i)=>`<i class="${i<=n?'active':''}"></i>`).join('')}</div>${n===0?`<h2>Verify your email</h2><p class="intro">We sent a verification link to <b>${esc(state.registerEmail||'your email')}</b>. This demo lets you continue without an email service.</p><div class="market-alert">✉️ &nbsp; Check your inbox for a verification link.</div><button class="btn full" data-action="onboard-next">I've verified my email</button><p class="auth-foot"><button class="linkbtn" data-action="onboard-next">Resend email</button></p>`:n===1?`<h2>Create your profile</h2><p class="intro">This is how the community will know you.</p><div class="field"><label>Display name</label><input class="input" id="onName" value="${esc(state.profile.display)}"></div><div class="field"><label>Username</label><input class="input" id="onUser" value="${esc(state.profile.username)}"></div><div class="field"><label>Bio</label><textarea class="textarea" id="onBio" placeholder="Tell us about your fish journey"></textarea></div><div class="field"><label>Account type</label><select class="select"><option>Hobbyist</option><option>Breeder</option><option>Seller</option><option>Collector</option><option>Judge</option><option>Fish Farm</option><option>Aquarium Store</option></select></div><button class="btn full" data-action="save-onprofile">Continue</button>`:n===2||n===3?`<h2>What are you interested in?</h2><p class="intro">${n===2?'Choose topics to shape your feed.':'Pick the fish and hobbies you love.'} Select as many as you like.</p><div class="interest-grid">${(n===2?topics:['Goldfish','Ranchu','Oranda','Breeding','Goldfish Competition','Aquarium','Aquascape','Koi','Betta','Fish Farming','Fish Business']).map(x=>`<label class="interest"><input type="checkbox" value="${x}"> ${x}</label>`).join('')}</div><button class="btn full" data-action="onboard-next">Continue</button><p class="auth-foot"><button class="linkbtn" data-action="onboard-next">Skip for now</button></p>`:`<h2>Find your people</h2><p class="intro">Follow a few fish friends to get your feed started.</p>${suggested.map(s=>`<div class="suggest"><span class="avatar">${s.avatar}</span><div class="suggest-info"><strong>${s.name}</strong><span>@${s.handle} · ${s.bio}</span></div><button class="follow-mini" data-action="suggest-follow">Follow</button></div>`).join('')}<button class="btn full" data-action="finish-onboarding" style="margin-top:20px">Go to my feed</button><p class="auth-foot"><button class="linkbtn" data-action="finish-onboarding">Skip</button></p>`}</div></section></div>`}
function forgotHTML(){return `<div class="auth-wrap"><section class="auth-art"><div class="auth-art-inner"><div class="fish-mark"><img src="https://i.ibb.co.com/93YJFbNF/icon-40x40-px.png" alt="Tongkrongan Ikan logo"></div><h1>Back to<br>the shoal.</h1><p>We'll help you get back to your fish community.</p></div></section><section class="auth-side"><div class="auth-box"><button class="linkbtn" data-action="login" style="margin-bottom:30px">← Back to log in</button><div class="auth-brand"><span class="fish-mark"><img src="https://i.ibb.co.com/93YJFbNF/icon-40x40-px.png" alt="Tongkrongan Ikan logo"></span> Tongkrongan Ikan</div><div id="forgotStep"><h2>Forgot password?</h2><p class="intro">Enter your email address and we'll send you a reset link.</p><form id="forgotForm"><div class="field"><label>Email address</label><input class="input" type="email" required placeholder="name@example.com"></div><button class="btn full">Send reset link</button></form></div></div></section></div>`}
function appHTML(){return `<div class="app"><div class="layout"><aside class="sidebar"><div class="logo"><span class="logo-mark"><img src="https://i.ibb.co.com/93YJFbNF/icon-40x40-px.png" alt="Tongkrongan Ikan logo"></span><span class="logo-text">Tongkrongan Ikan</span></div><div class="nav-list">${navBtn('home','Home')}${navBtn('search','Search')}${navBtn('plus','Create')}${navBtn('heart','Activity',state.notifications.length?state.notifications.length:null)}${navBtn('user','Profile')}${navBtn('repeat','Following')}${navBtn('globe','Topics')}${navBtn('calendar','Event')}${navBtn('store','Marketplace')}${navBtn('settings','Settings')}</div><div class="sidebar-bottom"><div class="new-thread"><button class="btn full" data-action="compose">＋ &nbsp; New thread</button><div class="shortcut-hint" style="justify-content:center;margin-top:8px">Press <kbd>N</kbd> to post</div></div><div class="sidebar-user" data-action="profile">${avatarHTML(state.profile.avatar,'avatar sm')}<div class="user-meta"><strong style="font-size:13px;display:block">${esc(state.profile.display)}</strong><span class="subtle">@${esc(state.profile.username)}</span></div><button class="icon-button user-more" data-action="more-account">${ico('more')}</button></div></div></aside><main class="main"><div class="topbar"><button class="icon-button mobile-menu-trigger" data-action="mobile-menu" aria-label="Open all menus" title="All menus">${ico('menu')}</button><h1>${pageTitle()}</h1><button class="icon-button" data-action="theme" title="Toggle light/dark mode">${ico(state.theme==='dark'?'sun':'moon')}</button></div><div id="page">${pageHTML()}</div></main><aside class="rightbar"><div class="searchbox">${ico('search')}<input placeholder="Search Tongkrongan Ikan" data-action="searchbox"></div><div class="side-card"><h3>Topics for you</h3>${topics.slice(0,5).map((t,i)=>`<div class="topic-row"><div><strong>#${t.replaceAll(' ','')}</strong><span style="display:block">${(i+1)*1.2}K posts</span></div><button class= function openMobileMenu(){let root=document.getElementById('overlay-root');if(!root)return;let items=[['home','Home'],['search','Search'],['plus','Create'],['heart','Activity'],['user','Profile'],['repeat','Following'],['globe','Topics'],['calendar','Event'],['store','Marketplace'],['settings','Settings']];root.innerHTML=`<div class="mobile-drawer-backdrop"><aside class="mobile-drawer"><div class="drawer-head"><div class="logo"><span class="logo-mark"><img src="https://i.ibb.co.com/93YJFbNF/icon-40x40-px.png" alt="Tongkrongan Ikan logo"></span><span>Tongkrongan Ikan</span></div><button class="icon-button" data-drawer-close aria-label="Close menu">${ico('close')}</button></div><div class="drawer-account">${avatarHTML(state.profile.avatar,'avatar')}<div><strong>${esc(state.profile.display)}</strong><small>@${esc(state.profile.username)}</small></div></div><nav class="drawer-nav">${items.map(([icon,label])=>`<button class="nav-item ${activePage(label)?'active':''}" data-drawer-page="${label}"><span class="nav-icon">${ico(icon)}</span><span>${label}</span>${label==='Activity'&&state.notifications.length?`<span class="badge">${state.notifications.length}</span>`:''}</button>`).join('')}</nav><button class="btn full drawer-compose" data-drawer-compose>＋ &nbsp; New thread</button><div class="drawer-foot">Fish together. Grow together. 🐟</div></aside><button class="drawer-dismiss" aria-label="Close menu"></button></div>`;let backdrop=root.querySelector('.mobile-drawer-backdrop');root.querySelector('.drawer-dismiss').onclick=()=>root.innerHTML='';root.querySelector('[data-drawer-close]').onclick=()=>root.innerHTML='';root.querySelectorAll('[data-drawer-page]').forEach(b=>b.onclick=()=>{let label=b.dataset.drawerPage;root.innerHTML='';if(label==='Create'){showCompose();return}state.page=label;render()});root.querySelector('[data-drawer-compose]').onclick=()=>{root.innerHTML='';showCompose()}}

function homeHTML(){return `<div class="feed-tabs"><button class="feed-tab ${state.feed==='For You'?'active':''}" data-action="feed" data-feed="For You">For You</button><button class="feed-tab ${state.feed==='Following'?'active':''}" data-action="feed" data-feed="Following">Following</button></div><div class="quick-compose">${avatarHTML(state.profile.avatar,'avatar sm')}<input placeholder="What's swimming through your mind?" data-action="compose"><button class="btn small" data-action="compose">Post</button></div><div>${state.posts.map(postHTML).join('')}</div>`}
function postHTML(p){return `<article class="post" data-post="${p.id}">${avatarHTML(p.avatar)}<div class="post-body"><div class="post-head"><span class="username">${esc(p.user)}</span>${p.verified?'<span class="tiny">✓</span>':''}<span class="handle">@${esc(p.handle)}</span><time>${p.time}</time><button class="icon-button more" data-action="post-menu" data-id="${p.id}">${ico('more')}</button></div><div class="post-text">${formatText(p.text)}</div>${p.media?`<div class="post-image placeholder" role="img" aria-label="Fish photo">${p.media}</div>`:''}${p.poll?`<div class="poll">${p.poll.map((o,i)=>`<div class="poll-option" data-action="vote" data-id="${p.id}" data-index="${i}"><div class="percent" style="width:${o[1]}%"></div><span>${o[0]} <b style="float:right">${o[1]}%</b></span></div>`).join('')}<div class="poll-foot">2 days left · ${p.poll.reduce((a,b)=>a+b[1],0)*19} votes</div></div>`:''}${p.quote?`<div class="quoted"><div class="quoted-head">${avatarHTML(p.quote.avatar,'avatar xs')} ${esc(p.quote.user)} <span class="muted">@${esc(p.quote.handle)}</span></div><p>${formatText(p.quote.text)}</p></div>`:''}<div class="post-actions"><button class="action ${p.liked?'liked':''}" data-action="like" data-id="${p.id}">${ico('heart')}<span>${p.likes}</span></button><button class="action" data-action="thread" data-id="${p.id}">${ico('comment')}<span>${p.replies}</span></button><button class="action" data-action="repost" data-id="${p.id}">${ico('repeat')}<span>${p.reposts}</span></button><button class="action" data-action="share" data-id="${p.id}">${ico('send')}</button></div><div class="engagement">${p.views} views · View insights</div></div></article>`}
function searchHTML(){return `<section class="section-content"><h2 class="section-title">Search</h2><p class="section-sub">Find people, fish, and conversations.</p><input class="search-input" id="searchInput" placeholder="Search usernames, creators, brands, topics..." value="${esc(state.query)}"><div class="search-filter">${['Top','People','Topics','Posts','Trending'].map(x=>`<button class="chip ${state.searchFilter===x?'active':''}" data-action="search-filter" data-filter="${x}">${x}</button>`).join('')}</div><h3 style="font-size:15px;margin:16px 0 8px">${state.query?'Results':'Trending conversations'}</h3>${state.query?searchResults():trendingHTML()}</section>`}
function searchResults(){let q=state.query.toLowerCase();let people=suggested.filter(x=>(x.name+' '+x.handle).toLowerCase().includes(q));let posts=state.posts.filter(x=>(x.text+' '+x.user+' '+x.handle).toLowerCase().includes(q));if(!people.length&&!posts.length)return `<div class="empty"><strong>No results yet</strong>Try another name, topic, or keyword.</div>`;return [...people.map(x=>`<div class="result-row">${avatarHTML(x.avatar)}<div class="result-copy"><strong>${x.name}</strong><small>@${x.handle} · Creator</small></div><button class="follow-mini" data-action="follow" data-handle="${x.handle}">${state.follows[x.handle]?'Following':'Follow'}</button></div>`),...posts.map(x=>`<div class="result-row"><span class="avatar">${x.avatar}</span><div class="result-copy"><strong>${x.user}</strong><small>${x.text.slice(0,90)}…</small></div></div>`)].join('')}
function trendingHTML(){return `<div>${['#RanchuSeason','#GoldfishCare','#AquascapeSunday','#KoiShow2026','#BreedingJourney'].map((x,i)=>`<div class="result-row"><span class="muted" style="font-size:13px;width:25px">${i+1}</span><div class="result-copy"><small>Trending in fish community</small><strong>${x}</strong><small>${(i+3)*1.2}K threads</small></div><button class="icon-button">${ico('more')}</button></div>`).join('')}</div>`}
function activityHTML(){let data=[['👤','<strong>Ranchu Room</strong> started following you.','@ranchuroom · 12m'],['❤️','<strong>Koi Society</strong> liked your thread.','Your pond goals post · 1h'],['↩','<strong>Aqua Nara</strong> replied: “So lovely!”','Your new tank thread · 3h'],['@','<strong>Dimas Aquatics</strong> mentioned you in a thread.','@nadia.ikan · 6h'],['↻','<strong>Goldfish Daily</strong> reposted your thread.','Your ranchu update · 1d'],['❝','<strong>Fishroom Bandung</strong> quoted your post.','The fish show discussion · 2d']];return `<div class="feed-tabs"><button class="feed-tab active">All</button><button class="feed-tab">Mentions</button></div>${data.map((x,i)=>`<div class="notice">${avatarHTML(['🐠','鯉','🌿','🧑🏻','🐟','🫧'][i],'avatar sm')}<span class="notice-dot"></span><div class="notice-copy">${x[1]}<time>${x[2]}</time></div><button class="icon-button" data-action="nav" data-page="Profile">${ico('heart')}</button></div>`).join('')}`}
function profileHTML(){let me=state.profile,market=state.profileMode==='marketplace';let tabs=market?['Etalase','Penawaran']:['Threads','Replies','Reposts','Media'];let selected=state.profileTab;if(!tabs.includes(selected)){selected=market?'Etalase':'Threads';state.profileTab=selected}let fishList=state.fish.length?state.fish:[{id:'sample',name:'Mochi',kind:'Ranchu Goldfish',type:'Fancy Goldfish',size:'8 cm',age:'1 year',location:'Bandung, Indonesia',achievement:'First place · Local Ranchu Meet 2026',proof:'Verified photo proof',emoji:'🐠',bid:false}];return `<div class="account-switcher-wrap"><div class="account-switcher" role="tablist" aria-label="Switch account"><button class="${!market?'active':''}" data-action="profile-mode" data-mode="threads">◎ &nbsp; Akun Threads</button><button class="${market?'active':''}" data-action="profile-mode" data-mode="marketplace">▧ &nbsp; Akun Marketplace</button></div></div><div class="profile-cover"></div><div class="profile-top"><div class="profile-head">${avatarHTML(me.avatar,'avatar lg')}<div class="profile-buttons"><button class="btn outline small" data-action="share-profile">Share profile</button><button class="btn outline small" data-action="edit-profile">Edit profile</button></div></div><div class="profile-name">${esc(me.display)}${market?' <span class="seller-badge">Seller</span>':''}</div><div class="profile-handle">@${esc(me.username)} ${market?'· Akun Marketplace':''}</div><div class="profile-bio">${formatText(me.bio)}</div><div class="profile-link">${me.link?`↗ &nbsp;${esc(me.link)}`:'Add a link'}</div><div class="profile-stats"><span><strong>${me.followers.toLocaleString()}</strong> followers</span><span><strong>${me.following.toLocaleString()}</strong> following</span></div></div>${market?`<div class="market-profile-note"><strong>Etalase Audi Ikan</strong><span>Atur koleksi, harga awal, dan kelipatan bid. Komunitas dapat ikut menawar ikan yang kamu buka untuk bid.</span></div>`:''}<div class="profile-tabs">${tabs.map(x=>`<button class="${selected===x?'active':''}" data-action="profile-tab" data-tab="${x}">${x}</button>`).join('')}</div>${market?(selected==='Etalase'?`<div class="collection"><div class="collection-top"><div><h3>🐠 Koleksi &amp; lelang</h3><span class="subtle">Ikan publik dan penawaran komunitas</span></div><button class="btn outline small" data-action="add-fish">＋ Tambah ikan</button></div>${fishList.map(fishHTML).join('')}</div>`:`<section class="section-content"><h3 style="margin-top:0">Penawaran komunitas</h3><p class="section-sub">Riwayat bid pada koleksi ikanmu.</p>${fishList.filter(f=>f.bid).length?fishList.filter(f=>f.bid).map(f=>`<div class="bid-history-card"><strong>${esc(f.name)}</strong><span>Bid tertinggi: ${moneyIDR(f.currentBid||f.startPrice)}</span><small>${(f.bids||[]).length} penawaran · kenaikan ${moneyIDR(f.increment)}</small></div>`).join(''):`<div class="empty"><strong>Belum ada ikan yang dibuka untuk bid</strong>Tambahkan ikan lalu aktifkan fitur bid agar komunitas bisa menawar.</div>`}</section>`):selected==='Threads'?`<div class="collection"><div class="collection-top"><div><h3>🐠 Koleksi Ikan</h3><span class="subtle">Fish, milestones &amp; stories</span></div><button class="btn outline small" data-action="add-fish">＋ Add fish</button></div>${fishList.map(fishHTML).join('')}</div><div>${state.posts.filter(p=>p.handle===me.username).map(postHTML).join('')||`<div class="empty"><strong>Start your story</strong>Share a fish update with the community.<button class="btn small" data-action="compose" style="display:block;margin:16px auto">Create a thread</button></div>`}</div>`:selected==='Media'?`<div class="empty"><strong>Your media will live here</strong>Photos and videos from your threads.</div>`:`<div class="empty"><strong>No ${selected.toLowerCase()} yet</strong>When you ${selected.toLowerCase()} a thread, it will show up here.</div>`}`}

function moneyIDR(value){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(value)||0)}
function fishHTML(f){let current=Number(f.currentBid??f.startPrice)||0,bids=f.bids||[];return `<div class="fish-card"><div class="fish-thumb">${f.photo?`<img src="${f.photo}" alt="${esc(f.name)}" style="width:100%;height:100%;object-fit:cover">`:f.emoji||'🐠'}</div><div class="fish-info"><h4>${esc(f.name||'My fish')}</h4><div class="fish-meta">${esc(f.kind||'Goldfish')} · ${esc(f.type||'Fancy')}<br>Size ${esc(f.size||'—')} · Age ${esc(f.age||'—')}<br>📍 ${esc(f.location||'—')}<br>🏆 ${esc(f.achievement||'Growing every day')} · ${esc(f.proof||'Proof added')}</div>${f.bid?`<div class="auction-box"><div><small>${bids.length?'Bid tertinggi':'Harga awal'}</small><strong>${moneyIDR(current)}</strong></div><div class="auction-step">Kenaikan ${moneyIDR(f.increment)}<br><b>${bids.length} bid komunitas</b></div><button class="btn small" data-action="bid" data-id="${f.id}">Bid ikan ini</button></div>${bids.length?`<div class="latest-bids">Bid terbaru · ${esc(bids[bids.length-1].user)} ${moneyIDR(bids[bids.length-1].amount)}</div>`:''}`:''}<div class="fish-actions"><div><button class="action" data-action="like-fish">${ico('heart')} 28</button><button class="action" data-action="comment-fish">${ico('comment')} 6</button></div>${f.bid?`<span class="subtle">Bid terbuka</span>`:'<span class="subtle">Tidak dibuka untuk bid</span>'}</div></div></div>`}

function followingHTML(){return `<section class="section-content"><h2 class="section-title">Following</h2><p class="section-sub">The fish people you follow.</p><input class="search-input" id="followingInput" placeholder="Search following" value="${esc(state.followingSearch)}">${[...suggested,{name:'Dimas Aquatics',handle:'dimas.aqua',avatar:'🧑🏻',bio:'New to the fish show scene'}].filter(u=>(u.name+' '+u.handle).toLowerCase().includes(state.followingSearch.toLowerCase())).map(u=>`<div class="follow-row">${avatarHTML(u.avatar)}<div class="follow-copy"><strong>${u.name}</strong><p>@${u.handle} · ${u.bio}</p></div><button class="btn outline small" data-action="manage-follow" data-handle="${u.handle}">${state.follows[u.handle]?'Following':'Follow'}</button><button class="icon-button" data-action="unfollow" data-handle="${u.handle}" title="Unfollow">${ico('more')}</button></div>`).join('')}<div class="subtle" style="padding:17px">Manage who you follow. You can unfollow anyone at any time.</div></section>`}
function topicsHTML(){return `<section class="section-content"><h2 class="section-title">Topics</h2><p class="section-sub">Follow your favorite fish conversations.</p><div class="searchbox">${ico('search')}<input id="topicSearch" placeholder="Find a topic"></div>${topics.map((t,i)=>`<div class="result-row"><span style="font-size:26px;width:38px;text-align:center">${['🐠','🐟','🏆','🫧','🐡','🐠','🐉','🌿'][i]}</span><div class="result-copy"><strong>${t}</strong><small>${((i+4)*1.7).toFixed(1)}K threads · ${i%2?'Growing':'Popular'}</small></div><button class="btn outline small" data-action="topic-follow">${state.follows['topic-'+t]?'Following':'Follow'}</button></div>`).join('')}<button class="btn full" style="margin-top:18px" data-action="compose-topic">＋ Start a topic discussion</button></section>`}
function eventHTML(){let events=[{id:'ranchu-meetup',date:'12 OCT',name:'Ranchu Meetup Bandung',place:'Bandung, Jawa Barat',kind:'Meetup · In person',desc:'Ngobrol santai bareng penghobi ranchu, sharing perawatan, dan mini showcase koleksi komunitas.'},{id:'aqua-live',date:'18 OCT',name:'Aquascape Sunday Live',place:'Online · Live session',kind:'Workshop · Online',desc:'Sesi inspirasi layout aquascape natural bersama aquascaper komunitas.'},{id:'goldfish-contest',date:'02 NOV',name:'Contest Goldfish Nusantara',place:'Jakarta, Indonesia',kind:'Competition · In person',desc:'Ajang komunitas untuk merayakan fancy goldfish dan bertemu breeder dari berbagai daerah.'}];return `<section class="section-content"><h2 class="section-title">Event komunitas</h2><p class="section-sub">Temukan meetup, kontes, dan sesi berbagi dari komunitas ikan.</p><div class="event-list">${events.map(ev=>`<article class="event-card"><div class="event-date">${ev.date.split(' ')[0]}<small>${ev.date.split(' ')[1]}</small></div><div class="event-info"><span class="event-kind">${ev.kind}</span><h3>${ev.name}</h3><p>${ev.desc}</p><div class="event-place">⌖ &nbsp;${ev.place}</div><button class="btn ${state.rsvps[ev.id]?'outline':'small'}" data-action="event-rsvp" data-event="${ev.id}">${state.rsvps[ev.id]?'✓ Going':'Interested'}</button></div></article>`).join('')}</div></section>`}
function settingsHTML(){let rows=[['Account','Your personal information'],['Privacy','Public or private profile'],['Notifications','Activity alerts'],['Security','Password and login'],['Blocked accounts','Manage blocked people'],['Hidden words','Filter comments and posts'],['Mentions','Who can mention you'],['Replies','Who can reply'],['Likes','Like visibility'],['Language','English · Bahasa Indonesia'],['Accessibility','Motion and display'],['Content preferences','Sensitive content controls'],['Help','Support and FAQs'],['About','Version 1.0 · Tongkrongan Ikan']];return `<section class="section-content"><h2 class="section-title">Settings</h2><p class="section-sub">Make Tongkrongan Ikan yours.</p><div class="side-card" style="margin:0 0 16px"><div style="display:flex;align-items:center;gap:12px">${avatarHTML(state.profile.avatar)}<div style="flex:1"><strong>${esc(state.profile.display)}</strong><div class="subtle">@${esc(state.profile.username)}</div></div><button class="btn outline small" data-action="edit-profile">Edit profile</button></div></div><div class="settings-list">${rows.map((r,i)=>`<button class="settings-row" data-action="setting" data-setting="${r[0]}"><span><strong>${r[0]}</strong><small style="display:block;color:var(--muted);margin-top:4px">${r[1]}</small></span><span>›</span></button>`).join('')}</div><div style="margin:18px 0"><button class="btn outline full" data-action="logout">Log out</button></div></section>`}
function marketHTML(){return `<div class="market-card"><div class="market-icon">🐟</div><h2>Marketplace is swimming your way</h2><p>A trusted place to discover fish, connect with breeders, and find aquarium essentials — all from the community.</p><div class="market-alert">Fitur akan segera tersedia</div><button class="btn outline" data-action="market-notify">Notify me when it launches</button></div>`}
function formatText(t){return esc(t||'').replace(/(#[\w]+)/g,'<span class="tag">$1</span>').replace(/(@[\w.]+)/g,'<span class="tag">$1</span>').replace(/\n/g,'<br>')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bind(){
 document.querySelectorAll('[data-action]').forEach(el=>{el.addEventListener('click',e=>{if(el.tagName==='INPUT'&&el.type==='text')return;let a=el.dataset.action,id=Number(el.dataset.id),p=state.posts.find(x=>x.id===id);switch(a){
 case'theme':state.theme=state.theme==='dark'?'light':'dark';render();break;
 case'login':state.screen='login';render();break;case'register':state.screen='register';render();break;case'forgot':state.screen='forgot';render();break;
 case'new-password':showResetForm();break;
 case'password':{let i=document.getElementById('loginPass');if(i)i.type=i.type==='password'?'text':'password';break}
 case'demo-google':case'demo-apple':toast('Demo sign-in: opening your fish community');enterApp();break;
 case'logout':state.authenticated=false;state.screen='login';render();break;
 case'nav':if(el.dataset.page==='Create'){showCompose();break}state.page=el.dataset.page;render();break;
 case'mobile-menu':openMobileMenu();break;
 case'profile':state.page='Profile';render();break;
 case'compose':showCompose();break;
 case'feed':state.feed=el.dataset.feed;render();break;
 case'like':if(p){p.liked=!p.liked;p.likes+=p.liked?1:-1;render()}break;
 case'thread':if(p)showThread(p);break;
 case'repost':if(p)showRepost(p);break;
 case'share':sharePost(p);break;
 case'post-menu':if(p)showPostMenu(p);break;
 case'vote':toast('Your vote has been counted');break;
 case'profile-tab':state.profileTab=el.dataset.tab;render();break;
 case'profile-mode':state.profileMode=el.dataset.mode;state.profileTab=state.profileMode==='marketplace'?'Etalase':'Threads';render();break;
 case'edit-profile':showEditProfile();break;
 case'share-profile':navigator.clipboard?.writeText(location.href).then(()=>toast('Profile link copied')).catch(()=>toast('Profile link ready to share'));break;
 case'add-fish':showAddFish();break;
 case'like-fish':toast('You liked this fish');break;case'comment-fish':toast('Comments are open to the community');break;case'bid':{let fish=state.fish.find(f=>String(f.id)===el.dataset.id);if(fish)showBidModal(fish);else toast('Bid is not available for this fish');break}
 case'follow':case'manage-follow':{let h=el.dataset.handle;state.follows[h]=!state.follows[h];render();toast(state.follows[h]?'You are now following':'Unfollowed');break}
 case'unfollow':{let h=el.dataset.handle;state.follows[h]=false;render();toast('Account unfollowed');break}
 case'topic-follow':{let t=el.dataset.topic||'Goldfish';let h='topic-'+t;state.follows[h]=!state.follows[h];el.textContent=state.follows[h]?'Following':'Follow';toast(state.follows[h]?'Topic followed':'Topic unfollowed');break}
 case'search-filter':state.searchFilter=el.dataset.filter;render();break;
 case'setting':showSetting(el.dataset.setting);break;
 case'market-notify':toast('You’ll hear from us when the marketplace opens');break;
 case'event-rsvp':state.rsvps[el.dataset.event]=!state.rsvps[el.dataset.event];render();toast(state.rsvps[el.dataset.event]?'You’re on the event list!':'RSVP removed');break;
 case'compose-topic':showCompose('Start a topic discussion');break;
 case'onboard-next':state.onboard=Math.min(4,state.onboard+1);render();break;
 case'save-onprofile':{state.profile.display=document.getElementById('onName').value||state.profile.display;state.profile.username=document.getElementById('onUser').value||state.profile.username;state.profile.bio=document.getElementById('onBio').value;state.onboard=2;render();break}
 case'suggest-follow':el.textContent=el.textContent==='Follow'?'Following':'Follow';break;
 case'finish-onboarding':state.authenticated=true;state.page='Home';render();toast('Welcome to the community!');break;
 case'demo-apple':case'register-google':case'register-apple':toast('Social sign-in will be connected in the production version');break;
 case'more-account':showAccountMenu();break;
 }});});
 let lf=document.getElementById('loginForm');if(lf)lf.addEventListener('submit',e=>{e.preventDefault();enterApp()});
 let rf=document.getElementById('registerForm');if(rf)rf.addEventListener('submit',e=>{e.preventDefault();let d=new FormData(rf);if(d.get('password')!==d.get('confirm')){toast('Passwords do not match');return}state.profile.display=d.get('display');state.profile.username=d.get('username').replace(/^@/,'');state.registerEmail=d.get('email');let photo=document.getElementById('regPhoto').files[0];if(photo){let reader=new FileReader();reader.onload=()=>{state.profile.avatar=reader.result;state.onboard=0;state.screen='onboarding';render()};reader.readAsDataURL(photo)}else{state.onboard=0;state.screen='onboarding';render()}});
 let ff=document.getElementById('forgotForm');if(ff)ff.addEventListener('submit',e=>{e.preventDefault();document.getElementById('forgotStep').innerHTML=`<h2>Check your email</h2><p class="intro">If an account exists for this email, a password reset link is on its way.</p><div class="market-alert">✉️ &nbsp; Check your inbox and spam folder.</div><button class="btn full" data-action="new-password">I have a reset link</button>`;bind()});
 let search=document.getElementById('searchInput');if(search)search.addEventListener('input',()=>{state.query=search.value;let pg=document.getElementById('page');let pos=search.selectionStart;pg.innerHTML=searchHTML();let ni=document.getElementById('searchInput');ni.focus();ni.setSelectionRange(pos,pos);bind()});
 let fi=document.getElementById('followingInput');if(fi)fi.addEventListener('input',()=>{state.followingSearch=fi.value;let pg=document.getElementById('page');let pos=fi.selectionStart;pg.innerHTML=followingHTML();let ni=document.getElementById('followingInput');ni.focus();ni.setSelectionRange(pos,pos);bind()});
 let ti=document.getElementById('topicSearch');if(ti)ti.addEventListener('input',()=>{let val=ti.value.toLowerCase();document.querySelectorAll('.result-row').forEach(r=>r.classList.toggle('hidden',!r.innerText.toLowerCase().includes(val)))});
 document.querySelectorAll('[data-action="searchbox"]').forEach(i=>i.addEventListener('focus',()=>{state.page='Search';render();document.getElementById('searchInput')?.focus()}));
}
function enterApp(){state.authenticated=true;state.page='Home';render();toast('Welcome back to Tongkrongan Ikan')}
function showCompose(prefill=''){document.getElementById('overlay-root').innerHTML=`<div class="overlay" data-action="close-overlay"><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><button class="icon-button" data-action="close-modal">${ico('close')}</button><strong>New thread</strong><button class="linkbtn" data-action="save-draft">Save draft</button></div><div class="modal-body"><div class="compose-top">${avatarHTML(state.profile.avatar)}<div class="compose-area"><div class="post-head"><strong>${esc(state.profile.display)}</strong><span class="muted">@${esc(state.profile.username)}</span></div><textarea id="composeText" placeholder="What's swimming through your mind?">${esc(prefill||state.draft)}</textarea><div id="attachPreview"></div></div></div><div class="compose-options"><button data-action="attach-image">▧ Photo / video</button><button data-action="attach-gif">GIF</button><button data-action="add-poll">▤ Poll</button><button data-action="add-emoji">☺ Emoji</button><button data-action="add-mention">@ Mention</button><button data-action="add-hashtag"># Topic</button></div><div style="display:flex;gap:10px;margin-top:15px;align-items:center"><span class="subtle">Reply settings</span><select class="select" id="replySetting" style="width:auto;padding:9px 12px"><option>Anyone can reply</option><option>People you follow</option><option>Only mentioned</option></select><span class="subtle" style="margin-left:auto">🌐 Public</span></div><div class="compose-bottom"><span class="subtle">Your post will be visible to everyone</span><button class="btn" data-action="publish">Post</button></div><input class="file-input" type="file" id="mediaFile" accept="image/*,video/*"></div></div></div>`;bindModal()}
function bindModal(){let root=document.getElementById('overlay-root');root.querySelectorAll('[data-action]').forEach(el=>el.onclick=e=>{if(el.closest('.modal')&&e.target===el)return;let a=el.dataset.action;if(a==='close-overlay'||a==='close-modal'){root.innerHTML='';return}switch(a){case'save-draft':state.draft=document.getElementById('composeText').value;root.innerHTML='';toast('Draft saved');break;case'publish':{let text=document.getElementById('composeText').value.trim();if(!text&&!state.pendingMedia){toast('Write something before posting');break}state.posts.unshift({id:Date.now(),user:state.profile.display,handle:state.profile.username,avatar:state.profile.avatar,time:'now',text,media:state.pendingMedia||null,likes:0,replies:0,reposts:0,views:'0',liked:false});state.pendingMedia=null;state.draft='';state.page='Home';root.innerHTML='';render();toast('Your thread is live');break}case'attach-image':document.getElementById('mediaFile').click();break;case'attach-gif':document.getElementById('composeText').value+=' [GIF: happy fish]';break;case'add-poll':{let txt=document.getElementById('composeText');txt.value+='\n\nPoll: Option 1 | Option 2';txt.focus();break}case'add-emoji':document.getElementById('composeText').value+=' 🐠';break;case'add-mention':document.getElementById('composeText').value+=' @';document.getElementById('composeText').focus();break;case'add-hashtag':document.getElementById('composeText').value+=' #Goldfish';document.getElementById('composeText').focus();break;case'reply-send':{let v=document.getElementById('replyText').value.trim();if(v){let list=document.getElementById('threadReplies');list.insertAdjacentHTML('beforeend',`<article class="post">${avatarHTML(state.profile.avatar)}<div class="post-body"><div class="post-head"><span class="username">${esc(state.profile.display)}</span><span class="handle">@${esc(state.profile.username)}</span><time>now</time></div><div class="post-text">${formatText(v)}</div><div class="post-actions"><button class="action">${ico('heart')} 0</button><button class="action">${ico('comment')} 0</button></div></div></article>`);document.getElementById('replyText').value='';toast('Reply added')}break}case'fish-save':saveFish();break;case'submit-bid':submitBid(el.dataset.fish);break;case'profile-save':saveProfile();break;case'account-action':root.innerHTML='';toast('This control is ready for your account settings');break;case'new-password':showResetForm();break;case'copy-link':navigator.clipboard?.writeText(location.href);root.innerHTML='';toast('Link copied');break;case'report':root.innerHTML='';toast('Report received. Our moderation team will review it.');break;case'hide':root.innerHTML='';toast('Post hidden from your feed');break;case'block':root.innerHTML='';toast('Account blocked');break;case'mute':root.innerHTML='';toast('Account muted');break;case'restrict':root.innerHTML='';toast('Account restricted');break;case'quote-now':{let p=state.pendingQuote;root.innerHTML='';showCompose('');setTimeout(()=>{let t=document.getElementById('composeText');if(t)t.value='\n\n↪ '+p.user+': '+p.text},10);break}case'repost-now':{let p=state.posts.find(x=>x.id===Number(el.dataset.id));if(p){p.reposts++;state.posts.unshift({...p,id:Date.now(),time:'now',isRepost:true});root.innerHTML='';render();toast('Reposted to your profile')}break}case'setting-save':root.innerHTML='';toast('Your preference has been saved');break;}});
 let bidToggle=root.querySelector('#fishBid');if(bidToggle)bidToggle.onchange=()=>root.querySelector('#bidPricing')?.classList.toggle('hidden',!bidToggle.checked);
 let file=root.querySelector('#mediaFile');if(file)file.onchange=()=>{let f=file.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{state.pendingMedia=reader.result;root.querySelector('#attachPreview').innerHTML=`<img src="${reader.result}" class="post-image" style="max-height:180px">`;};reader.readAsDataURL(f)};
}
function showThread(p){let root=document.getElementById('overlay-root');root.innerHTML=`<div class="overlay" data-action="close-overlay"><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><button class="icon-button" data-action="close-modal">${ico('back')}</button><strong>Thread</strong><button class="icon-button" data-action="post-menu" data-id="${p.id}">${ico('more')}</button></div><div class="thread-root">${postHTML(p)}<div class="engagement">${p.views} views · View insights</div></div><div class="replybox">${avatarHTML(state.profile.avatar,'avatar sm')}<textarea id="replyText" placeholder="Reply to ${esc(p.user)}..."></textarea><button class="btn small" data-action="reply-send">Reply</button></div><div class="thread-connector" id="threadReplies"><article class="post">${avatarHTML('🌿')}<div class="post-body"><div class="post-head"><span class="username">Aqua Nara</span><span class="handle">@aquanara</span><time>1h</time></div><div class="post-text">Love seeing this! What are you feeding them lately?</div><div class="post-actions"><button class="action">${ico('heart')} 8</button><button class="action">${ico('comment')} Reply</button></div></div></article><article class="post">${avatarHTML('🧑🏻')}<div class="post-body"><div class="post-head"><span class="username">Dimas Aquatics</span><span class="handle">@dimas.aqua</span><time>48m</time></div><div class="post-text">This is so helpful, thanks for sharing 🐟</div></div></article></div></div></div>`;bindModal()}
function showRepost(p){let root=document.getElementById('overlay-root');state.pendingQuote=p;root.innerHTML=`<div class="overlay" data-action="close-overlay"><div class="modal" style="width:min(100%,330px)" onclick="event.stopPropagation()"><button class="settings-row" data-action="repost-now" data-id="${p.id}"><span>↻ &nbsp; Repost</span></button><button class="settings-row" data-action="quote-now"><span>❝ &nbsp; Quote</span></button><button class="settings-row" data-action="close-modal"><span>Cancel</span></button></div></div>`;bindModal()}
function sharePost(p){if(!p)return;let val=location.href.split('#')[0]+'#thread-'+p.id;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(val).then(()=>toast('Thread link copied')).catch(()=>toast('Share link: '+val));else toast('Share link copied')}

function showEditProfile(){let root=document.getElementById('overlay-root');root.innerHTML=`<div class="overlay" data-action="close-overlay"><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><button class="linkbtn" data-action="close-modal">Cancel</button><strong>Edit profile</strong><button class="btn small" data-action="profile-save">Done</button></div><div class="modal-body"><div style="display:flex;justify-content:center;margin:5px 0 20px;position:relative">${avatarHTML(state.profile.avatar,'avatar lg')}<label class="btn small" style="position:absolute;bottom:0;left:calc(50% + 20px)">Change photo<input type="file" id="profilePhoto" accept="image/*" class="file-input"></label></div><div class="field"><label>Name</label><input class="input" id="editName" value="${esc(state.profile.display)}"></div><div class="field"><label>Username</label><input class="input" id="editUsername" value="${esc(state.profile.username)}"></div><div class="field"><label>Bio</label><textarea class="textarea" id="editBio" rows="4">${esc(state.profile.bio)}</textarea></div><div class="field"><label>Link</label><input class="input" id="editLink" value="${esc(state.profile.link)}"></div><div class="field"><label>Privacy</label><select class="select"><option>Public</option><option>Private</option></select></div></div></div></div>`;bindModal()}
function saveProfile(){let root=document.getElementById('overlay-root');state.profile.display=root.querySelector('#editName').value;state.profile.username=root.querySelector('#editUsername').value.replace(/^@/,'');state.profile.bio=root.querySelector('#editBio').value;state.profile.link=root.querySelector('#editLink').value;let file=root.querySelector('#profilePhoto').files[0];let done=()=>{root.innerHTML='';render();toast('Profile updated')};if(file){let reader=new FileReader();reader.onload=()=>{state.profile.avatar=reader.result;done()};reader.readAsDataURL(file)}else done()}
function showAddFish(){let root=document.getElementById('overlay-root');root.innerHTML=`<div class="overlay" data-action="close-overlay"><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><button class="linkbtn" data-action="close-modal">Cancel</button><strong>Tambah ke Koleksi Ikan</strong><button class="btn small" data-action="fish-save">Simpan</button></div><div class="modal-body"><div class="field"><label>Foto ikan / bukti</label><input class="input" id="fishPhoto" type="file" accept="image/*" style="padding:9px"></div><div class="form-row"><div class="field"><label>Nama ikan</label><input class="input" id="fishName" placeholder="Contoh: Mochi"></div><div class="field"><label>Jenis / varietas ikan</label><input class="input" id="fishKind" placeholder="Contoh: Ranchu Goldfish"></div></div><div class="form-row"><div class="field"><label>Tipe ikan</label><input class="input" id="fishType" placeholder="Fancy Goldfish"></div><div class="field"><label>Ukuran</label><input class="input" id="fishSize" placeholder="8 cm"></div></div><div class="form-row"><div class="field"><label>Umur</label><input class="input" id="fishAge" placeholder="1 tahun"></div><div class="field"><label>Lokasi</label><input class="input" id="fishLocation" placeholder="Bandung, Indonesia"></div></div><div class="field"><label>Achievement &amp; detail bukti</label><input class="input" id="fishAchievement" placeholder="Penghargaan, kontes, atau milestone"></div><label class="checkbox-copy bid-enable"><input type="checkbox" id="fishBid"> Buka fitur bid untuk komunitas</label><div id="bidPricing" class="bid-pricing hidden"><div class="form-row"><div class="field"><label>Harga awal (Rupiah)</label><div class="money-input"><span>Rp</span><input class="input" id="fishStartPrice" type="number" min="0" step="1" value="100000"></div></div><div class="field"><label>Kelipatan kenaikan bid</label><div class="money-input"><span>Rp</span><input class="input" id="fishIncrement" type="number" min="1" step="1" value="10000"></div></div></div><p class="subtle">Contoh: kenaikan Rp10.000 berarti tawaran berikutnya harus mengikuti kelipatan tersebut. Harga dan bid ditampilkan dalam IDR.</p></div><div class="subtle">Koleksi bersifat publik. Jika bid diaktifkan, pengguna komunitas dapat mengajukan tawaran.</div></div></div></div>`;bindModal()}

function saveFish(){let r=document.getElementById('overlay-root'),file=r.querySelector('#fishPhoto').files[0],bid=r.querySelector('#fishBid').checked,start=Math.max(0,Number(r.querySelector('#fishStartPrice').value)||100000),increment=Math.max(1,Number(r.querySelector('#fishIncrement').value)||10000);let f={id:Date.now(),name:r.querySelector('#fishName').value||'Ikan baru',kind:r.querySelector('#fishKind').value||'Goldfish',type:r.querySelector('#fishType').value||'Fancy Goldfish',size:r.querySelector('#fishSize').value||'—',age:r.querySelector('#fishAge').value||'—',location:r.querySelector('#fishLocation').value||'—',achievement:r.querySelector('#fishAchievement').value||'Tambahan koleksi baru',proof:file?'Bukti foto ditambahkan':'Cerita pemilik',bid,startPrice:start,currentBid:start,increment,bids:[],emoji:'🐠'};let done=()=>{state.fish.unshift(f);r.innerHTML='';render();toast(bid?'Ikan ditambahkan — bid komunitas dibuka':'Ikan ditambahkan ke koleksi')};if(file){let reader=new FileReader();reader.onload=()=>{f.photo=reader.result;done()};reader.readAsDataURL(file)}else done()}
function showBidModal(f){let root=document.getElementById('overlay-root'),current=Number(f.currentBid??f.startPrice)||0,inc=Math.max(1,Number(f.increment)||1),bids=f.bids||[],min=bids.length?current+inc:current;root.innerHTML=`<div class="overlay" data-action="close-overlay"><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><button class="icon-button" data-action="close-modal">${ico('back')}</button><strong>Ajukan bid</strong><button class="icon-button" data-action="close-modal">${ico('close')}</button></div><div class="modal-body"><div class="bid-item-summary">${f.photo?`<img src="${f.photo}" alt="${esc(f.name)}">`:`<span>🐠</span>`}<div><strong>${esc(f.name)}</strong><small>${esc(f.kind)} · ${esc(f.type)}</small></div></div><div class="bid-summary"><div><small>Bid tertinggi saat ini</small><strong>${moneyIDR(current)}</strong></div><div><small>${bids.length?'Bid minimum berikutnya':'Bid pertama minimal'}</small><strong>${moneyIDR(min)}</strong></div></div><div class="field"><label>Tawaran kamu (IDR)</label><div class="money-input bid-amount"><span>Rp</span><input class="input" id="bidAmount" type="number" min="${min}" step="${inc}" value="${min}"></div><small class="subtle">Kelipatan kenaikan: ${moneyIDR(inc)}</small></div>${bids.length?`<div class="bid-history"><strong>Penawaran terbaru</strong>${bids.slice(-4).reverse().map(b=>`<div><span>${esc(b.user)}</span><b>${moneyIDR(b.amount)}</b></div>`).join('')}</div>`:''}<div class="bid-terms">Dengan mengajukan bid, kamu menyatakan penawaran ini serius. Transaksi dan pembayaran belum diproses dalam prototype ini.</div><button class="btn full" data-action="submit-bid" data-fish="${f.id}">Kirim bid ${moneyIDR(min)}</button></div></div></div>`;bindModal()}
function submitBid(id){let f=state.fish.find(x=>String(x.id)===String(id)),r=document.getElementById('overlay-root');if(!f)return;let amount=Number(r.querySelector('#bidAmount').value),current=Number(f.currentBid??f.startPrice)||0,inc=Math.max(1,Number(f.increment)||1),bids=f.bids||[],base=bids.length?current:(Number(f.startPrice)||0),difference=amount-base,steps=difference/inc,minimum=bids.length?current+inc:base;if(!Number.isFinite(amount)||amount<base||(bids.length&&difference<inc)||Math.abs(steps-Math.round(steps))>1e-8){toast(`Bid harus minimal ${moneyIDR(minimum)} dan mengikuti kelipatan ${moneyIDR(inc)}`);return}f.bids=f.bids||[];f.bids.push({user:state.profile.display,amount,at:Date.now()});f.currentBid=amount;r.innerHTML='';render();toast('Bid kamu berhasil dikirim')}
